<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="timer">
      <p class="clockface js-clockface">00:00:00</p>
      <div class="actions">
        <button class="timer-btn" data-action="start">Запустити</button>
        <button class="timer-btn" data-action="stop">Зупинити</button>
        <button class="timer-btn" data-action="reset">Reset</button>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
  <script src="countdown-timer.js"></script>
</html>
